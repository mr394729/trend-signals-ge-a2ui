[project]
name = "trend-signals-a2ui"
version = "0.1.0"
description = "Trend Signals: an agentic analytics workspace for Gemini Enterprise (A2UI v0.9, custom HTML in an IFrame, ADK agent). A reference blueprint."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]~=0.3.22",
    # The public A2UI Agent SDK: agent card extension, parts and validation against the
    # Gemini Enterprise composite catalog (src/trend_signals/kit/sdk.py).
    "a2ui-agent-sdk==0.7.0",
    "google-adk>=1.16",
    "google-genai>=1.16",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "httpx>=0.27",
    "google-auth>=2.30",
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_signals"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
